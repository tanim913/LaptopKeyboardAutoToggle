name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Publish Self-Contained Win-x64 Executable
      run: |
        dotnet publish LaptopKeyboardAutoToggle.csproj -c Release -r win-x64 -p:PublishSingleFile=true --self-contained true -o ./release-win-x64

    - name: Bundle Windows Release Files & Interception DLL
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/oblitum/Interception/releases/download/v1.0.1/Interception.zip" -OutFile "Interception.zip"
        Expand-Archive -Path "Interception.zip" -DestinationPath "InterceptionPkg" -Force
        Copy-Item -Path "InterceptionPkg/Interception/library/x64/interception.dll" -Destination "./release-win-x64/interception.dll" -Force
        Copy-Item -Path "config.json" -Destination "./release-win-x64/config.json" -Force
        Copy-Item -Path "ONE-CLICK-SETUP.bat" -Destination "./release-win-x64/ONE-CLICK-SETUP.bat" -Force
        Copy-Item -Path "Install-Task.ps1" -Destination "./release-win-x64/Install-Task.ps1" -Force
        Copy-Item -Path "Uninstall-Task.ps1" -Destination "./release-win-x64/Uninstall-Task.ps1" -Force
        Copy-Item -Path "Setup-Interception.ps1" -Destination "./release-win-x64/Setup-Interception.ps1" -Force
        Compress-Archive -Path "./release-win-x64/*" -DestinationPath "./LaptopKeyboardAutoToggle-win-x64.zip" -Force

    - name: Build Ubuntu / Debian Package (.deb)
      shell: pwsh
      run: |
        python linux/build_deb.py

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LaptopKeyboardAutoToggle-win-x64
        path: ./LaptopKeyboardAutoToggle-win-x64.zip

    - name: Upload Debian Artifact
      uses: actions/upload-artifact@v4
      with:
        name: laptop-keyboard-auto-toggle-deb
        path: ./laptop-keyboard-auto-toggle_1.0-1_all.deb

    - name: Release to GitHub
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./LaptopKeyboardAutoToggle-win-x64.zip
          ./laptop-keyboard-auto-toggle_1.0-1_all.deb
        body_path: ./release-notes.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
