name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Publish Self-Contained Win-x64 Executable
      run: |
        dotnet publish LaptopKeyboardAutoToggle.csproj -c Release -r win-x64 -p:PublishSingleFile=true --self-contained true -o ./release-win-x64

    - name: Download & Bundle Interception DLL
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/oblitum/Interception/releases/download/v1.0.1/Interception.zip" -OutFile "Interception.zip"
        Expand-Archive -Path "Interception.zip" -DestinationPath "InterceptionPkg"
        Copy-Item -Path "InterceptionPkg/Interception/library/x64/interception.dll" -Destination "./release-win-x64/interception.dll"
        Copy-Item -Path "config.json" -Destination "./release-win-x64/config.json"
        Compress-Archive -Path "./release-win-x64/*" -DestinationPath "./LaptopKeyboardAutoToggle-win-x64.zip"

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LaptopKeyboardAutoToggle-win-x64
        path: ./LaptopKeyboardAutoToggle-win-x64.zip

    - name: Release to GitHub
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: ./LaptopKeyboardAutoToggle-win-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

